<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат-бот</title>
    <link rel="stylesheet" href="/static/chatbot/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<!-- Кнопка для открытия/закрытия чата -->
<button id="chat-toggle">💬 Чат</button>

<!-- Контейнер чата -->
<div id="chat-container">
    <div id="chat-header">
        <span>Чат-бот</span>
        <button id="chat-close">×</button>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input">
        <input type="text" id="user-input" placeholder="Напишите сообщение...">
        <button id="send-btn">Отправить</button>
    </div>
</div>

<script src="/static/chatbot/script.js"></script>
</body>
</html>
